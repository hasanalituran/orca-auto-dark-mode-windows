name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('orca-plugin.json','utf8')); console.log('manifest ok')"
      - name: Check required files
        run: |
          test -f src/worker.ts
          test -f src/panel.tsx
          test -f LICENSE
          echo "files ok"
